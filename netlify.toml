# Netlify: static publish of dist/, no build step.
# Link yusufmax/Agalarov2 in the Netlify dashboard and these settings apply automatically.

[build]
  publish = "dist"
  command = ""

# Video chunks and fonts carry versioned names, so they can be cached for a year.
[[headers]]
  for = "/assets/*.bin"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.ttf"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The manifest, HTML, JS and CSS must always revalidate (JS/CSS use ?v= busters).
[[headers]]
  for = "/assets/videos.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
